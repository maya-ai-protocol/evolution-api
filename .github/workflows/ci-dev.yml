name: Deploy WPP API to ECS with ALB

on:
  push:
    branches:
      - dev  # altere se for 'main' ou outra branch

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: wpp-api-dev
  ECS_CLUSTER: wpp-api-cluster-dev
  ECS_SERVICE: wpp-api-service-dev
  ECS_TASK_DEFINITION: wpp-api-task-dev
  CONTAINER_NAME: wpp-api-container

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_ENV

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --query 'taskDefinition' \
            --region $AWS_REGION > task-definition.json

          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition.json > filtered-task-definition.json

      - name: Update ECS task definition with new image and environment variables
        run: |
          jq --arg IMAGE "$image" \
            --arg AUTHENTICATION_API_KEY "${{ secrets.AUTHENTICATION_API_KEY }}" \
            --arg DATABASE_CONNECTION_URI_DEV "${{ secrets.DATABASE_CONNECTION_URI_DEV }}" \
            --arg CACHE_REDIS_URI "${{ secrets.CACHE_REDIS_URI_DEV }}" \
            --arg SQS_ACCESS_KEY_ID "${{ secrets.AWS_ACCESS_KEY_ID }}" \
            --arg SQS_SECRET_ACCESS_KEY "${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            --arg SQS_REGION "us-east-1" \
            --arg SQS_ACCOUNT_ID "${{ secrets.SQS_ACCOUNT_ID_DEV }}" \
            --arg SQS_QUEUE_URL "https://sqs.us-east-1.amazonaws.com/601139476230/wpp-api-queue-dev" \
            '.containerDefinitions[0].image = $IMAGE |
              .containerDefinitions[0].environment = [
                { "name": "DATABASE_ENABLED", "value": "true" },
                { "name": "DATABASE_SAVE_DATA_INSTANCES", "value": "true" },
                { "name": "DATABASE_SAVE_MESSAGE_UPDATE", "value": "true" },
                { "name": "DATABASE_SAVE_DATA_GROUPS_NEW_MESSAGE", "value": "true" },
                { "name": "DATABASE_SAVE_DATA_CONTACTS", "value": "true" },
                { "name": "DATABASE_SAVE_DATA_CHATS", "value": "true" },
                { "name": "CACHE_REDIS_ENABLED", "value": "true" },
                { "name": "CACHE_REDIS_URI", "value": $CACHE_REDIS_URI },
                { "name": "CACHE_REDIS_TTL", "value": "3600" },
                { "name": "CACHE_REDIS_SAVE_INSTANCES", "value": "true" },
                { "name": "SQS_ENABLED", "value": "true" },
                { "name": "SQS_ACCESS_KEY_ID", "value": $SQS_ACCESS_KEY_ID },
                { "name": "SQS_SECRET_ACCESS_KEY", "value": $SQS_SECRET_ACCESS_KEY },
                { "name": "SQS_REGION", "value": $SQS_REGION },
                { "name": "SQS_ACCOUNT_ID", "value": $SQS_ACCOUNT_ID }
              ]' \
            filtered-task-definition.json > updated-task-definition.json


      - name: Register new ECS task definition
        id: register-task-def
        run: |
          TASK_REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://updated-task-definition.json \
            --region $AWS_REGION \
            --query 'taskDefinition.revision' --output text)
          echo "TASK_REVISION=$TASK_REVISION" >> $GITHUB_ENV

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --task-definition $ECS_TASK_DEFINITION:$TASK_REVISION \
            --region $AWS_REGION

      - name: Wait for ECS service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services $ECS_SERVICE \
            --region $AWS_REGION
